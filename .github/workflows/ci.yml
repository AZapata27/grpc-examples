name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Shared protobuf contracts: generate the stubs and install them in the local
      # Maven repository so the Spring Boot server and client can resolve them.
      - name: grpc-interfaces (install)
        run: mvn -B -ntp install
        working-directory: grpc-interfaces

      - name: server-grpc-spring-boot
        run: mvn -B -ntp verify
        working-directory: server-grpc-spring-boot

      - name: client-grpc-spring-boot
        run: mvn -B -ntp verify
        working-directory: client-grpc-spring-boot

      - name: server-client-grpc-quarkus
        run: mvn -B -ntp verify
        working-directory: server-client-grpc-quarkus

      - name: cloud-eureka-server
        run: mvn -B -ntp verify
        working-directory: cloud-eureka-server
