name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One leg per consumer module. Each leg first installs the shared protobuf contracts
  # (grpc-interfaces) into the local Maven repository, so grpc-interfaces is compiled and
  # validated in every leg as well.
  build:
    name: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - server-grpc-spring-boot
          - client-grpc-spring-boot
          - server-client-grpc-quarkus
          - cloud-eureka-server
    uses: AZapata27/reusable-workflows/.github/workflows/java-maven.yml@dd1bf38000c4f44c4939abe2ce0da8e1fac11993 # v1.0.0
    permissions:
      contents: read
    with:
      java-version: '21'
      working-directory: ${{ matrix.module }}
      pre-build-command: mvn -B -f grpc-interfaces/pom.xml install -DskipTests
      maven-args: -B verify
      report-name: test-reports-${{ matrix.module }}

  workflow-lint:
    uses: AZapata27/reusable-workflows/.github/workflows/workflow-lint.yml@dd1bf38000c4f44c4939abe2ce0da8e1fac11993 # v1.0.0
    permissions:
      contents: read

  security:
    uses: AZapata27/reusable-workflows/.github/workflows/security.yml@dd1bf38000c4f44c4939abe2ce0da8e1fac11993 # v1.0.0
    permissions:
      contents: read
      actions: read            # CodeQL: workflow run metadata
      security-events: write   # CodeQL: SARIF upload
    with:
      codeql-languages: '["java-kotlin", "actions"]'
      codeql-build-mode: none
